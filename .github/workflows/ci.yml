name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Тесты с детектором гонок
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -cover ./...
      - name: Тесты
        if: matrix.os != 'ubuntu-latest'
        run: go test -count=1 ./...

  # Настоящий HTTP-сервис под нагрузкой k6: сколько запросов пропускает каждый алгоритм
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: grafana/setup-k6-action@v1
      - name: Запуск сервиса
        run: |
          go build -o ratelab ./cmd/ratelab
          ./ratelab serve --addr 127.0.0.1:8080 --limit 100 --window 1s > service.log 2>&1 &
          for i in $(seq 50); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 0.2; done
      - name: k6
        run: k6 run k6/compare.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-site.mjs
      - run: node scripts/wasm-smoke.mjs site
